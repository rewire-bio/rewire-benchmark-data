name: Benchmark data checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-latest
    # Write access only so main pushes can publish the immutable prepared release asset.
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the website image: the prepared SQLite file's bytes depend on Node's bundled SQLite.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:package
      - run: npm test
      - run: npm run test:python
      - run: npm run typecheck
      - name: Reproduce the current release and prepared website artifact
        run: npm run build
      - name: Require reviewed prepared artifacts
        run: npm run verify:package && git diff --exit-code -- data website
      - name: Check the prepared release file against the live query engine
        run: npm run serving:parity
      - name: Publish the prepared release file (main only; never replaces an existing asset)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run serving:publish
