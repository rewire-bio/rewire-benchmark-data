name: Benchmark data checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-data-${{ github.ref }}
  cancel-in-progress: true
env:
  # The release of rdf-kg-mcp whose bundle format the knowledge graph must satisfy.
  RDF_KG_MCP: git+https://github.com/rewire-bio/rdf-kg-mcp@v0.1.0
jobs:
  data:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run verify:package
      - run: npm test
      - run: npm run test:python
      - run: npm run test:kg
      - run: npm run typecheck
      - name: Reproduce the current release, knowledge graph and prepared website artifact
        run: npm run build
      - name: Require reviewed prepared artifacts
        run: npm run verify:package && git diff --exit-code -- data website
      - name: Check the knowledge-graph bundle against the bundle format
        run: uvx --from "$RDF_KG_MCP" rdf-kg-mcp verify public/kg
      - name: Keep the knowledge-graph bundle for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kg-bundle
          path: public/kg
          retention-days: 7

  publish-kg:
    # Publishes the bundle once per data release, as assets of a GitHub release tagged
    # kg-<release id>. An existing release is never replaced.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kg-bundle
          path: kg
      - uses: astral-sh/setup-uv@v6
      - name: Publish the bundle for a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(jq -r .release_id kg/manifest.json)
          tag="kg-$release"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Knowledge graph for $release is already published; leaving it unchanged."
            exit 0
          fi
          uvx --from "$RDF_KG_MCP" rdf-kg-mcp pack kg -o kg-bundle.tar.gz
          uvx --from "$RDF_KG_MCP" rdf-kg-mcp verify kg-bundle.tar.gz
          inferred=$(jq -r '.files["inferred.nq"].quads' kg/manifest.json)
          asserted=$(jq -r '.files["asserted.nq"].quads' kg/manifest.json)
          cat > notes.md <<EOF
          Knowledge-graph bundle for data release \`$release\`: $asserted asserted and $inferred inferred statements, SHACL validated.

          Serve it to Claude Code with [rdf-kg-mcp](https://github.com/rewire-bio/rdf-kg-mcp):

          \`\`\`sh
          claude mcp add rewire-benchmarks -- uvx --from $RDF_KG_MCP rdf-kg-mcp serve https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/kg-bundle.tar.gz
          \`\`\`

          See docs/linked-data.md for the vocabulary, the inference rules and example queries.
          EOF
          gh release create "$tag" kg-bundle.tar.gz kg/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Knowledge graph $release" --notes-file notes.md
