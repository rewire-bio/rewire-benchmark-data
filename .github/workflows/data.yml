name: Benchmark data checks
on:
  pull_request:
  # Lets a merge queue run these checks on the queued merge, if one is enabled for main.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels its older run. Runs on main queue instead, so every
# merge gets a complete result and starts its own release run.
concurrency:
  group: benchmark-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NODE_OPTIONS: --max-old-space-size=8192

# Every job starts at once on its own machine. Pull requests run the fast test set; main runs
# all tests. The SHACL job checks the whole store once; records -- add checks only a batch.
# A release cut by hand (a change to data/omics/release-config.json) is also rebuilt, and main
# publishes its prepared file once everything passed. The knowledge graph is not built here
# (kg-release.yml).
jobs:
  checks:
    runs-on: ubuntu-latest
    name: checks (${{ matrix.task }})
    strategy:
      fail-fast: false
      matrix:
        task: [store, types, python, kg, shacl-1, shacl-2, shacl-3, shacl-4, tests-1, tests-2, tests-3, tests-4, tests-5, tests-6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        if: matrix.task == 'kg' || startsWith(matrix.task, 'shacl-')
      - run: npm ci
      - name: Validate the record store, vocabularies and provenance
        if: matrix.task == 'store'
        run: npm run records -- check
      # GitHub warns above 50 MB and rejects pushes with a file over 100 MB. Split a growing
      # store file into more shards (docs/collection.md, "Where records live") before it gets there.
      - name: Keep every file under data/ below 50 MB
        if: matrix.task == 'store'
        run: |
          large=$(find data -type f -size +50000000c -exec ls -l {} + | awk '{print $5, $NF}')
          if [ -n "$large" ]; then
            echo "::error::Files under data/ over 50 MB (bytes, path):"
            echo "$large"
            exit 1
          fi
      - if: matrix.task == 'types'
        run: npm run typecheck
      - if: matrix.task == 'python'
        run: npm run test:python
      - if: matrix.task == 'kg'
        run: npm run test:kg
      # Each job checks a quarter of the targeted shapes against every record; together they
      # run the same check as `npm run kg:shapes`.
      - name: Validate every record against the SHACL shapes, ${{ matrix.task }} of 4 (asserted graph, no inference)
        if: startsWith(matrix.task, 'shacl-')
        env:
          SHARD: ${{ matrix.task }}
        run: npm run -s kg -- export && npm run -s kg:build -- --shapes-only --shard="${SHARD#shacl-}/4"
      - name: Tests, ${{ matrix.task }} of 6 (fast set on pull requests, all on main)
        if: startsWith(matrix.task, 'tests-')
        env:
          SHARD: ${{ matrix.task }}
          SCRIPT: ${{ github.event_name == 'pull_request' && 'test:fast' || 'test' }}
        run: npm run "$SCRIPT" -- --shard="${SHARD#tests-}/6"

  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether this run cuts a release
        id: mode
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release=true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            git diff --quiet "origin/$BASE_REF" HEAD -- data/omics/release-config.json && release=false || release=true
          else
            git diff --quiet HEAD^1 HEAD -- data/omics/release-config.json && release=false || release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release run: $release"
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.release == 'true'
        with:
          # Match the website image: the prepared SQLite file's bytes depend on Node's bundled SQLite.
          node-version: 24
          cache: npm
      - if: steps.mode.outputs.release == 'true'
        run: npm ci
      - name: Rebuild the release and prepared website artifact
        if: steps.mode.outputs.release == 'true'
        run: npm run build
      - name: Require reviewed prepared artifacts
        if: steps.mode.outputs.release == 'true'
        run: npm run verify:package && git diff --exit-code -- data website
      - name: Check the prepared file against the live query engine
        if: steps.mode.outputs.release == 'true'
        run: npm run serving:parity
      - name: Keep the prepared file for publishing
        if: steps.mode.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: public/serving
          retention-days: 3

  publish:
    # Runs only on main release pushes, and only after every check and the release rebuild pass.
    needs: [checks, release]
    if: needs.release.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-outputs
          path: public/serving
      - name: Publish the prepared release file (never replaces an existing asset)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: npm run serving:publish
      - name: Ask the website to adopt it
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: node scripts/release/dispatch-website.mjs
      - name: Start the knowledge-graph bundle build for the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kg-release.yml --repo "$GITHUB_REPOSITORY"
