name: Benchmark data checks
on:
  pull_request:
  # Lets a merge queue run these checks on the queued merge, if one is enabled for main.
  merge_group:
  push:
    branches: [main]
  # Every night the whole store is checked whatever changed, as the backstop for the scoped
  # checks that merges of records alone get.
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels its older run. Each commit on main gets its own run, and
# those run side by side: the checks only read, and a merge should not wait for the checks of
# the merge before it. Only the publish job of a hand-cut release writes, and it queues.
concurrency:
  group: benchmark-data-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NODE_OPTIONS: --max-old-space-size=8192

# Every job starts at once on its own machine. Pull requests run the fast test set; main runs
# all tests. A pull request that changes only records, batch folders and documents has its
# changed records checked against the shapes (scripts/ops/changed-records.py) and skips the
# knowledge-graph tests; any other pull request, and every push to main, checks the whole store.
# The release build validates the whole store again before anything is published.
# A release cut by hand (a change to data/omics/release-config.json) is also rebuilt, and main
# publishes its prepared file once everything passed. The knowledge graph is not built here
# (kg-release.yml).
jobs:
  checks:
    runs-on: ubuntu-latest
    name: checks (${{ matrix.task }})
    strategy:
      fail-fast: false
      matrix:
        task: [store, types, python, kg, shacl-1, shacl-2, shacl-3, shacl-4, tests-1, tests-2, tests-3, tests-4, tests-5, tests-6]
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the whole store must be checked
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        # A merge to main that changes only records, batch folders and documents is checked the
        # way its pull request was: against the commit before it. Each such commit is then
        # checked on top of a checked one, and the nightly run checks the whole store.
        run: |
          full=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            if python3 scripts/ops/changed-records.py "origin/$BASE_REF" > "$RUNNER_TEMP/changed-ids.txt"; then full=false; fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git fetch --quiet --depth=1 origin "$BEFORE" && python3 scripts/ops/changed-records.py "$BEFORE" > "$RUNNER_TEMP/changed-ids.txt"; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Whole-store checks: $full"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        if: matrix.task == 'kg' || startsWith(matrix.task, 'shacl-')
      - run: npm ci
      # Release files are not committed. Some tests read the newest published release's.
      - name: Fetch the newest published release's files
        if: startsWith(matrix.task, 'tests-')
        run: npm run release:fetch
      - name: Validate the record store, vocabularies and provenance
        if: matrix.task == 'store'
        run: npm run records -- check
      - name: Keep the list of protocols without a task link from growing (#208)
        if: matrix.task == 'store'
        run: npm run check:task-links
      # GitHub warns above 50 MB and rejects pushes with a file over 100 MB. Split a growing
      # store file into more shards (docs/collection.md, "Where records live") before it gets there.
      - name: Keep every file under data/ below 50 MB
        if: matrix.task == 'store'
        run: |
          large=$(find data -type f -size +50000000c -exec ls -l {} + | awk '{print $5, $NF}')
          if [ -n "$large" ]; then
            echo "::error::Files under data/ over 50 MB (bytes, path):"
            echo "$large"
            exit 1
          fi
      - if: matrix.task == 'types'
        run: npm run typecheck
      - if: matrix.task == 'python'
        run: npm run test:python
      - if: matrix.task == 'kg' && steps.scope.outputs.full == 'true'
        run: npm run test:kg
      # Each job checks a quarter of the targeted shapes against every record; together they
      # run the same check as `npm run kg:shapes`.
      - name: Validate every record against the SHACL shapes, ${{ matrix.task }} of 4 (asserted graph, no inference)
        if: startsWith(matrix.task, 'shacl-') && steps.scope.outputs.full == 'true'
        env:
          SHARD: ${{ matrix.task }}
        run: npm run -s kg -- export && npm run -s kg:build -- --shapes-only --shard="${SHARD#shacl-}/4"
      # The same check `records -- add` and `records -- change` run: the changed records, the
      # records that link to them and their link targets. One job does it; the other three pass.
      - name: Validate the changed records against the SHACL shapes
        if: matrix.task == 'shacl-1' && steps.scope.outputs.full != 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-ids.txt" ]; then echo "No record changed."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/subset"
          npm run -s kg -- subset "$RUNNER_TEMP/changed-ids.txt" "$RUNNER_TEMP/subset"
          npm run -s kg:build -- --shapes-only --kg-dir "$RUNNER_TEMP/subset" --context "$RUNNER_TEMP/subset/context.txt"
      - name: Tests, ${{ matrix.task }} of 6 (fast set on pull requests, all on main)
        if: startsWith(matrix.task, 'tests-')
        env:
          SHARD: ${{ matrix.task }}
          SCRIPT: ${{ (github.event_name == 'pull_request' || steps.scope.outputs.full != 'true') && 'test:fast' || 'test' }}
        run: npm run "$SCRIPT" -- --shard="${SHARD#tests-}/6"

  # The rebuilt core (docs/rebuild.md): load the whole store into one database, read every record
  # back and compare it with the original, then load the curation files and build the views.
  kb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 kb/migrate.py --check
      - run: python3 kb/curate.py
      - run: python3 kb/board.py
      - name: Duplicate rules against the store
        run: python3 -m unittest discover -s kb/tests
      - name: Find discrepancies from the database
        run: |
          python3 kb/discrepancies.py --release unreleased --out kb/build/discrepancies.json
          python3 -c "import json; ids = [d['id'] for d in json.load(open('kb/build/discrepancies.json'))['discrepancies']]; assert len(ids) == len(set(ids)), 'duplicate discrepancy IDs'; print(len(ids), 'discrepancies')"

  # Builds the release files from this commit (about a minute) and pages every use case at 20
  # and 100 evaluations per page, so a change that would make a use case unservable fails here,
  # before a release is cut from it.
  use-case-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run omics:release
      - run: npm run use-cases:check-pages

  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether this run cuts a release
        id: mode
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release=true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            git diff --quiet "origin/$BASE_REF" HEAD -- data/omics/release-config.json && release=false || release=true
          else
            git diff --quiet HEAD^1 HEAD -- data/omics/release-config.json && release=false || release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release run: $release"
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.release == 'true'
        with:
          # Match the website image: the prepared SQLite file's bytes depend on Node's bundled SQLite.
          node-version: 24
          cache: npm
      - if: steps.mode.outputs.release == 'true'
        run: npm ci
      # The release's files are not committed, but its receipt and website manifest are, and
      # they list the SHA-256 of every file, so a rebuild that matches them reproduces the files.
      # The newest published release's files are fetched first, as the release workflow does.
      - name: Rebuild the release and prepared website artifact
        if: steps.mode.outputs.release == 'true'
        run: |
          npm run release:fetch
          npm run build
      - name: Require reviewed prepared artifacts
        if: steps.mode.outputs.release == 'true'
        run: npm run verify:package && git diff --exit-code -- data website
      - name: Check the prepared file against the live query engine
        if: steps.mode.outputs.release == 'true'
        run: npm run serving:parity
      - name: Check every use-case page fits the response budget
        if: steps.mode.outputs.release == 'true'
        run: npm run use-cases:check-pages
      - name: Keep the prepared file and release files for publishing
        if: steps.mode.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            public/serving
            website/files
            data/omics/releases/*/*.gz
          retention-days: 3

  publish:
    # Runs only on main release pushes, and only after every check and the release rebuild pass.
    needs: [checks, release, use-case-pages]
    if: needs.release.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-data-hand-cut-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-outputs
          path: .
      - name: Publish the prepared release file and release files (never replaces an existing asset)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: npm run serving:publish
      - name: Ask the website to adopt it
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: node scripts/release/dispatch-website.mjs
      - name: Start the knowledge-graph bundle build for the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kg-release.yml --repo "$GITHUB_REPOSITORY"
