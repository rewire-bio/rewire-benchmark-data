name: Disagreement watcher
# After each successful release run, diffs the discrepancies in the newest knowledge-graph
# bundle (kg/<id>, discrepancies.json) against the one before, and files a "Lead:" issue,
# labelled lead and needs-tim and assigned to timini, for each new medium or high finding and
# each finding whose severity rose (#258). A finding that stops firing gets a comment on its open
# lead issue. Code: scripts/agents/watcher.mjs; prompt: agents/watcher.md; docs/agents.md.
#
# After a release run it reports only: the planned issues and comments go to the job summary
# and an artifact. Set the repository variable WATCHER_MODE to "live" to have those runs file
# the issues and post the comments. By hand, the mode input chooses.
#
# After a release run the watcher compares the newest release with the last one an earlier
# run in the same mode compared to (read from that run's artifact), so a release whose run
# failed or was replaced in the queue is not skipped. A release run that cuts no release still
# succeeds; the watcher then compares the same releases again and files nothing, because every
# issue and comment carries a hidden marker. The repository is always this one
# (github.repository), so the workflow moves with the code.
on:
  workflow_run:
    workflows:
      - "Cut and publish a release"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: fixtures, no model or GitHub calls. report-only: real diff, prints the issues. live: files them."
        type: choice
        options: [dry-run, report-only, live]
        default: report-only
      current:
        description: Release to check (default the newest kg/<id>)
        required: false
      previous:
        description: Release to compare it with (default the one published before it)
        required: false
  pull_request:
    paths:
      - agents/watcher.md
      - scripts/agents/watcher.mjs
      - scripts/agents/discovery.mjs
      - tests/agents-watcher-fixtures/**
      - tests/agents-watcher.test.ts
      - .github/workflows/watcher.yml
permissions:
  contents: read
  issues: write
  actions: read # to read the previous watcher run's artifact
concurrency:
  group: watcher-${{ github.event_name == 'pull_request' && github.ref || 'watch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  watch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'workflow_run' && (vars.WATCHER_MODE || 'report-only') || github.event_name == 'pull_request' && 'dry-run' || inputs.mode }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Refuse to run outside rewire-bio
        run: |
          if [ "${GITHUB_REPOSITORY%%/*}" != "rewire-bio" ]; then echo "::error::The watcher only runs in rewire-bio repositories."; exit 1; fi
      # Issues are filed as the rewire-bot app, like discovery's. Without the app they are filed
      # with GITHUB_TOKEN; the assignment still emails timini.
      - name: Token for this repository
        id: app
        if: env.MODE == 'live' && vars.REWIRE_BOT_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REWIRE_BOT_APP_ID }}
          private-key: ${{ secrets.REWIRE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Issues only: rewire-bot may push to main without the checks, and the watcher never needs to.
          permission-issues: write
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agents
            scripts/agents
            tests/agents-watcher-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Anthropic SDK
        if: env.MODE != 'dry-run' && env.HAS_KEY == 'true'
        run: npm ci --prefix scripts/agents --no-audit --no-fund
      - name: Download the two releases' discrepancies and the new release's records
        id: download
        if: env.MODE != 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ inputs.current }}
          PREVIOUS: ${{ inputs.previous }}
          EVENT: ${{ github.event_name }}
        run: |
          # Releases in the order they were cut (serving/<id>, which only the release workflow
          # creates), keeping those with a kg/<id> bundle. Tag order is wrong when two releases
          # share a date, and a bundle backfilled later by kg-release.yml has a later date.
          ids='^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{12}$'
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt,isDraft \
            --jq '[.[] | select(.isDraft | not)] as $r | ($r | map(.tagName) | map(select(startswith("kg/"))) | map(ltrimstr("kg/"))) as $kg
                  | [$r[] | select(.tagName | startswith("serving/")) | .id = (.tagName | ltrimstr("serving/")) | select(.id as $i | $kg | index($i))]
                  | sort_by(.createdAt) | .[].id')
          current="${CURRENT:-$(echo "$tags" | tail -n 1)}"
          before=$(echo "$tags" | grep -x -B1 "$current" | head -n 1)
          previous="$PREVIOUS"
          if [ -z "$previous" ] && [ "$EVENT" = workflow_run ]; then
            # The release the last watcher run in this mode compared to, if it is older than current.
            want="${MODE/-/ }"
            for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow watcher.yml --event workflow_run --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
              dir="$RUNNER_TEMP/last/$run"
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "watcher-$run" --dir "$dir" >/dev/null 2>&1 || continue
              [ -f "$dir/plan.json" ] || continue
              [ "$(jq -r '.mode // ""' "$dir/plan.json")" = "$want" ] || continue
              last=$(jq -r '.current // ""' "$dir/plan.json")
              # A release run that cut no release: the last run already compared this release.
              if [ "$last" = "$current" ]; then
                echo "No release since the last watcher run in this mode (run $run compared $current). Nothing to do." >> "$GITHUB_STEP_SUMMARY"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if echo "$tags" | grep -qx "$last" && [ "$last" != "$current" ] && echo "$tags" | grep -x -B1000 "$current" | grep -qx "$last"; then previous="$last"; fi
              break
            done
          fi
          previous="${previous:-$before}"
          for id in "$current" "$previous"; do echo "$id" | grep -Eq "$ids" || { echo "::error::No release '$id'"; exit 1; }; done
          if [ "$previous" = "$current" ]; then echo "::error::No release was published before $current"; exit 1; fi
          skipped=$(echo "$tags" | grep -x -A1000 "$previous" | grep -x -B1000 "$current" | sed '1d;$d' | paste -sd ' ' -)
          if [ -n "$skipped" ]; then
            echo "Releases between $previous and $current, not compared one by one: $skipped. A finding that was new in one of them and is still live in $current counts as new; one that came and went in between is not reported." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RUNNER_TEMP/rel/previous" "$RUNNER_TEMP/rel/current"
          gh release download "kg/$previous" --repo "$GITHUB_REPOSITORY" --pattern discrepancies.json --dir "$RUNNER_TEMP/rel/previous"
          gh release download "kg/$current" --repo "$GITHUB_REPOSITORY" --pattern discrepancies.json --dir "$RUNNER_TEMP/rel/current"
          gh release download "serving/$current" --repo "$GITHUB_REPOSITORY" --pattern "public.omics.releases.$current.records.jsonl.gz" --dir "$RUNNER_TEMP/rel/current"
          echo "Comparing $previous with $current"
      - name: Watch
        if: steps.download.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rel="$RUNNER_TEMP/rel"
          files="--previous $rel/previous/discrepancies.json --current $rel/current/discrepancies.json --records $(ls "$rel"/current/*.records.jsonl.gz 2>/dev/null | head -n 1)"
          case "$MODE" in
            dry-run) args="--dry-run" ;;
            report-only) args="--report-only $files" ;;
            live) args="$files --run-url $RUN_URL" ;;
            *) echo "::error::Unknown mode $MODE"; exit 1 ;;
          esac
          node scripts/agents/watcher.mjs $args --out watcher-out
      - name: Keep the planned issues and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-${{ github.run_id }}
          path: watcher-out
          if-no-files-found: ignore
          retention-days: 30
