name: Build and publish a knowledge-graph bundle
# Every night, and on demand. A data release builds and publishes its own bundle (release.yml)
# unless everything that changed since the last bundle was descriptive content; it then serves
# that bundle's discrepancies and leaves the bundle to this workflow. The nightly run builds the
# bundle (inference, checks, SHACL) for the newest published release if it has none, verifies its
# format with rdf-kg-mcp, checks that its discrepancies are the ones the release serves, and
# publishes it as `kg/<release id>`. Run by hand it also rebuilds a named release's bundle, to
# check that a published bundle reproduces. An existing bundle is never replaced.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      release_id:
        description: Data release to build the bundle for (default the newest published serving/<id>)
        required: false
permissions:
  contents: write
concurrency:
  group: knowledge-graph-release
  cancel-in-progress: false
env:
  RDF_KG_MCP: git+https://github.com/rewire-bio/rdf-kg-mcp@v0.4.0
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Find the release and the commit it was published from
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release_id }}
        run: |
          id="$REQUESTED"
          if [ -z "$id" ]; then
            id=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt,isDraft \
              --jq '[.[] | select(.isDraft | not) | select(.tagName | test("^serving/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{12}$"))] | sort_by(.createdAt) | last | .tagName | ltrimstr("serving/")')
          fi
          echo "$id" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{12}$' || { echo "::error::No published release '$id'"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/serving/$id" --jq .sha)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release $id, published from $sha"
          # The nightly run has nothing to do when the newest release already has its bundle.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && gh release view "kg/$id" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "kg/$id is already published"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.release.outputs.build == 'true'
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.release.outputs.build == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        if: steps.release.outputs.build == 'true'
      - run: npm ci
        if: steps.release.outputs.build == 'true'
      - name: Rebuild the release's catalogue and confirm it matches the receipt
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          npm run omics:release
          cmp public/omics/manifest.json "data/omics/releases/$RELEASE.json"
      - name: Build the bundle and check its format
        if: steps.release.outputs.build == 'true'
        run: |
          npm run kg:bundle
          npm run kg:verify
      # A release finds its discrepancies from the database (kb/discrepancies.py) and records their
      # hash in its serving receipt. The graph build here finds them from the graph. A different
      # hash means the two programs disagree: one of them has a bug, and the website is serving
      # the database's answer until it is fixed.
      - name: Check the discrepancies are the ones the release serves
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          gh release download "serving/$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "catalogue-$RELEASE.json" --dir "$RUNNER_TEMP/receipt"
          served=$(node -p "require('$RUNNER_TEMP/receipt/catalogue-$RELEASE.json').discrepancies_sha256 || ''")
          built=$(sha256sum public/kg/discrepancies.json | cut -d' ' -f1)
          echo "Served $served, built $built"
          if [ -n "$served" ] && [ "$served" != "$built" ]; then
            echo "::error::The discrepancies release $RELEASE serves differ from the ones its graph derives."
            exit 1
          fi
      - name: Publish it (never replaces an existing asset)
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: npm run kg:publish
