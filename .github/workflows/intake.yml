name: Intake agent
# Turns an issue labelled entity-request into a pull request that adds its entity records (#255).
# The prompt is agents/intake.md; setup and cost are in docs/agents.md. It never merges.
#
# Live runs push the branch and open the pull request as the rewire-bot GitHub App, so the pull
# request's author is the bot and its CI runs. Without ANTHROPIC_API_KEY a run writes a notice
# and passes.
#
# The run starts rdf-kg-mcp on the latest knowledge graph release (kg/<id>) over stdio, to find
# possible duplicates and link targets and to write the batch through its draft overlay. If the
# bundle or the server is not available, the run goes on with name checks only (docs/agents.md).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (ignored in dry-run, which reads tests/agents-intake-fixtures)
        default: ""
      mode:
        description: "dry-run: fixtures, no model or GitHub calls. report-only: real run, prints the pull request it would open. live: opens it."
        type: choice
        options: [dry-run, report-only, live]
        default: dry-run
      kg_release:
        description: KG release tag to load, such as kg/2026-11-19-0528a0ffe3cb (default the newest)
        default: ""
      store_ref:
        description: "Report-only replay: run against the store (data/) at this commit, and skip the existing pull request check"
        default: ""
  pull_request:
    paths:
      - agents/intake.md
      - scripts/agents/**
      - tests/agents-intake*/**
      - tests/agents-intake*
      - .github/workflows/intake.yml
permissions:
  contents: read
  issues: write
  pull-requests: read
# One run per issue at a time; pull request dry runs have their own group.
concurrency:
  group: intake-${{ github.event_name == 'pull_request' && github.ref || github.event.issue.number || inputs.issue || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NODE_OPTIONS: --max-old-space-size=8192
  # The knowledge graph server, pinned to a release.
  RDF_KG_MCP: git+https://github.com/rewire-bio/rdf-kg-mcp@v0.3.1
jobs:
  intake:
    # Only the entity-request label starts a run from an issue.
    if: github.event_name != 'issues' || github.event.label.name == 'entity-request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'issues' && 'live' || github.event_name == 'pull_request' && 'dry-run' || inputs.mode }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # The bot token pushes the branch and opens the pull request, so its CI runs. Live only.
      # It covers this repository only (no owner or repositories given): contents to push the
      # branch, pull requests to open one, issues to read the request and comment on it.
      - name: Token for the rewire-bot app
        id: app
        if: env.MODE == 'live' && env.HAS_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REWIRE_BOT_APP_ID }}
          private-key: ${{ secrets.REWIRE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # records -- add validates the batch against the SHACL shapes with uv.
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      # The Anthropic SDK and the MCP client. The dry run needs the MCP client too.
      - name: Install the agent dependencies
        if: env.MODE == 'dry-run' || env.HAS_KEY == 'true'
        run: npm ci --prefix scripts/agents --no-audit --no-fund
      # A report-only replay runs an issue against the store as it was at an earlier commit.
      - name: Store at the replay commit
        if: env.MODE == 'report-only' && inputs.store_ref != ''
        env:
          REF: ${{ inputs.store_ref }}
        run: |
          git fetch --depth 1 origin "$REF"
          git checkout FETCH_HEAD -- data
          echo "REPLAY=--replay" >> "$GITHUB_ENV"
      # The knowledge graph: the server, a bundle and the draft block for this checkout. The dry
      # run loads the small fixture bundle; the others the newest kg/<id> release. Any failure here
      # leaves KG_BUNDLE unset and the intake runs without the graph.
      - name: Knowledge graph server and bundle
        if: env.MODE == 'dry-run' || env.HAS_KEY == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KG_RELEASE: ${{ inputs.kg_release }}
        run: |
          uv tool install --quiet "$RDF_KG_MCP"
          npm run -s kg -- draft-block "$RUNNER_TEMP/draft-block.json"
          if [ "$MODE" = dry-run ]; then
            bundle=tests/agents-intake-kg-fixtures/bundle
          else
            tag="${KG_RELEASE:-$(gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("kg/"))] | sort_by(.createdAt) | last | .tagName')}"
            mkdir -p "$RUNNER_TEMP/kg"
            gh release download "$tag" --pattern 'kg-*.tar.gz' --dir "$RUNNER_TEMP/kg"
            bundle=$(ls "$RUNNER_TEMP"/kg/kg-*.tar.gz)
            echo "Bundle $tag: $(du -h "$bundle" | cut -f1)"
          fi
          {
            echo "KG_BUNDLE=$bundle"
            echo "KG_DRAFT_CONFIG=$RUNNER_TEMP/draft-block.json"
            echo "KG_MCP_COMMAND=rdf-kg-mcp"
            echo "RDF_KG_MCP_CACHE=$RUNNER_TEMP/kg-cache"
          } >> "$GITHUB_ENV"
      - name: Commit as the bot
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: Run the intake
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$MODE" in
            dry-run) args="--dry-run" ;;
            report-only) args="--report-only --issue $ISSUE ${REPLAY:-}" ;;
            live) args="--issue $ISSUE" ;;
            *) echo "::error::Unknown mode $MODE"; exit 1 ;;
          esac
          if [ "$MODE" != dry-run ] && ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::An issue number is required in $MODE mode"; exit 1
          fi
          node scripts/agents/intake.mjs $args --out intake-out
          # The dry run again on the knowledge-graph fixture: the real server on the fixture bundle.
          if [ "$MODE" = dry-run ] && [ -n "${KG_BUNDLE:-}" ]; then
            git checkout -- data && git clean -fdq data
            node scripts/agents/intake.mjs --dry-run --fixtures tests/agents-intake-kg-fixtures --out intake-out/kg
            node -e '
              const r = JSON.parse(require("fs").readFileSync("intake-out/kg/result.json", "utf8"));
              if (!r.kg?.used) { console.error("::error::The knowledge-graph dry run did not use the server: " + (r.kg?.error ?? "no kg block")); process.exit(1); }
              const links = r.links.map((l) => l.relation + " " + l.to).sort().join(", ");
              if (!links.includes("family catalog-model-evo-2") || !r.dropped.some((d) => d.duplicate === "cell-type-20261009-model-uce")) {
                console.error("::error::The knowledge-graph dry run did not rule the UCE duplicate or link the fixture checkpoint: " + links); process.exit(1);
              }'
          fi
      # Load time and peak memory of the knowledge graph server on this run, against the limits
      # in rdf-kg-mcp #8 (ready in under 60 s, under 4 GB).
      - name: Knowledge graph load
        if: always()
        run: |
          [ -f intake-out/result.json ] || exit 0
          node -e '
            const kg = JSON.parse(require("fs").readFileSync("intake-out/result.json", "utf8")).kg;
            if (!kg) { console.log("The run did not reach the knowledge graph."); process.exit(0); }
            if (!kg.used) { console.log("::warning::The knowledge graph was not used: " + kg.error); process.exit(0); }
            const line = `Knowledge graph ${kg.release}: ${kg.statements} statements, ready in ${kg.ready_seconds} s, peak memory ${kg.peak_memory_mb ?? "?"} MB, calls ${JSON.stringify(kg.calls ?? {})}`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${line}\n`);
            if (kg.ready_seconds > 60 || (kg.peak_memory_mb ?? 0) > 4096) console.log("::warning::The knowledge graph server is over its limits (60 s, 4 GB): " + line);'
      - name: Keep the result and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-${{ github.run_id }}
          path: intake-out
          if-no-files-found: ignore
          retention-days: 30
