name: Cut and publish a release
# On every push to main, and on demand: if main holds reviewed changes that are
# not in the current release, cut a release from them, check it, commit it to
# main, publish its prepared SQLite file, and dispatch `data-release` to
# rewire-database, whose adopt-data-release workflow deploys it. Evidence
# reaches main only through reviewed pull requests; this workflow only packages
# what is already there. Its own release commit does not start it again (pushes
# made with the workflow token start no workflows). The knowledge-graph bundle
# is not built here: once the release is published this workflow starts kg-release.yml for it,
# which builds and publishes the bundle separately, so the release never waits for it.
# Runs after "Benchmark data checks" passes on main, so it never repeats those checks, and
# never runs for a commit that failed them.
on:
  workflow_run:
    workflows: ["Benchmark data checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# Release runs queue rather than cancel. GitHub keeps one waiting run per group, so a merge
# made while a release is being cut replaces any older waiting run; that is harmless,
# because each run builds main as it is when it starts.
concurrency:
  group: benchmark-data-release
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The release notes list the pull requests merged since the previous release, so
          # the commit history is needed; file contents of older commits are not.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          # Match the website image: the prepared SQLite file's bytes depend on Node's bundled SQLite.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build a candidate release dated now
        id: candidate
        run: |
          previous=$(node scripts/release/next.mjs prepare)
          npm run build
          next=$(node scripts/release/next.mjs latest)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Previous release $previous; candidate $next"
      - name: Stop if the candidate only renames the current release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
        run: |
          # The receipt published with the previous prepared file records its serving contract.
          gh release download "serving/$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "catalogue-$PREVIOUS.json" --dir "$RUNNER_TEMP/published" \
            || echo "::warning::No published serving receipt for $PREVIOUS; comparing release files only."
          set +e
          node scripts/release/next.mjs pending "$PREVIOUS" "${{ steps.candidate.outputs.next }}" "$RUNNER_TEMP/published/catalogue-$PREVIOUS.json"
          status=$?
          set -e
          if [ "$status" = 3 ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$status" = 0 ] && echo "release=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Refuse a release that withholds reviewed use-case mappings
        if: steps.pending.outputs.release == 'true'
        run: node scripts/release/next.mjs withheld "${{ steps.candidate.outputs.previous }}" "${{ steps.candidate.outputs.next }}"
      # Types, tests, the store, SHACL, Python and KG tests already passed in "Benchmark data
      # checks" for this commit. The build itself refuses to change an archived file.
      - name: Keep only the new release and check the packaging and prepared file
        if: steps.pending.outputs.release == 'true'
        run: |
          npm run release:prune
          # The packaging check reads the git index, so stage the new release files first.
          git add -A data website
          npm run verify:package
          npm run serving:parity
      - name: Commit the release to main
        if: steps.pending.outputs.release == 'true'
        id: commit
        env:
          RELEASE: ${{ steps.candidate.outputs.next }}
        run: |
          git config user.name "rewire-release-bot"
          git config user.email "rewire-release-bot@users.noreply.github.com"
          git add -A data website
          git commit -m "Cut release $RELEASE"
          # A pull request merged while this release was being cut moves main on. Rebase the
          # release commit onto it and push again; the next run releases that pull request.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::Could not push the release after $attempt attempts."; exit 1; fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the prepared release file
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag the release commit itself; the website reads its revision from the tag.
          RELEASE_TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: npm run serving:publish
      - name: Ask the website to adopt it
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: node scripts/release/dispatch-website.mjs
      # The website's agent page links each release's bundle, so build it for every release, in its
      # own workflow so a slow or failing graph build never holds back the data release.
      - name: Start the knowledge-graph bundle build for this release
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kg-release.yml --repo "$GITHUB_REPOSITORY" -f release_id="${{ steps.candidate.outputs.next }}"
