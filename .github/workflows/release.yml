name: Cut and publish a release
# On every push to main, and on demand: if main holds reviewed changes that are
# not in the current release, cut a release from them, check it, commit its
# receipt and website manifest to main, publish its prepared SQLite file and
# release files as assets of `serving/<id>`, and dispatch `data-release` to
# rewire-database, whose adopt-data-release workflow deploys it. Evidence
# reaches main only through reviewed pull requests; this workflow only packages
# what is already there. Its own release commit does not start it again (pushes
# carries "[skip ci]", so it starts no workflows). The knowledge-graph bundle is
# built here, before the prepared SQLite file: its inference finds discrepancies
# between studies, and the prepared file serves them, so the website reads them
# from SQL in the same release (docs/discrepancies.md). The bundle is published as
# `kg/<id>` beside `serving/<id>`.
# Starts on the push, beside "Benchmark data checks", so the 20 minute build does not wait for
# them. Nothing is committed or published until those checks have passed on the newest pushed
# commit the release was built from; a release built from a commit that fails them stops there.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: Build the knowledge graph even if only descriptive content changed
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
# Release runs queue rather than cancel. GitHub keeps one waiting run per group, so a merge
# made while a release is being cut replaces any older waiting run; that is harmless,
# because each run builds main as it is when it starts. The merge is not in the release
# being cut, and it is not in the commit that release's tags name either (#267).
concurrency:
  group: benchmark-data-release
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=8192
  RDF_KG_MCP: git+https://github.com/rewire-bio/rdf-kg-mcp@v0.4.0

jobs:
  release:
    runs-on: ubuntu-latest
    # The knowledge-graph build (inference, SHACL, discrepancy rules) takes 20 to 30 minutes.
    timeout-minutes: 80
    steps:
      # main requires the data checks to pass, and only rewire-bot may push to it without them.
      # The release commit is pushed as rewire-bot for that reason. "[skip ci]" in its message
      # keeps that push from starting the checks and this workflow again.
      - name: Token for the rewire-bot app
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REWIRE_BOT_APP_ID }}
          private-key: ${{ secrets.REWIRE_BOT_PRIVATE_KEY }}
          # No owner or repositories: the token is scoped to the repository this runs in,
          # so it keeps working if the store moves to another repository.
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          # The release notes list the pull requests merged since the previous release, so
          # the commit history is needed; file contents of older commits are not.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          # Match the website image: the prepared SQLite file's bytes depend on Node's bundled SQLite.
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Build a candidate release dated now
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_BUILD: ${{ inputs.full_build }}
        run: |
          previous=$(node scripts/release/next.mjs prepare)
          # Release files are not committed. The previous release's come from its assets
          # (or Git at its tag, for releases cut before that); pending and withheld compare them.
          npm run release:fetch -- "$previous"
          npm run omics:release
          candidate=$(node -p "require('./public/omics/manifest.json').release_id")
          # Discrepancies come from the rebuilt core (docs/rebuild.md): the store is loaded into one
          # database and kb/discrepancies.py applies the rules to it, in about 15 seconds. It
          # writes the file scripts/kg/contradictions.py writes from the graph, byte for byte.
          # No graph bundle is built here. kg-release.yml builds one for the newest release every
          # night and fails if its discrepancies differ from the ones served. A manual run with
          # full_build builds the bundle here instead, as every release did before.
          reused=false
          if [ "${FULL_BUILD:-false}" != true ]; then
            mkdir -p public/kg
            python3 kb/migrate.py --out "$RUNNER_TEMP/kb.sqlite"
            python3 kb/discrepancies.py --db "$RUNNER_TEMP/kb.sqlite" --release "$candidate" --out public/kg/discrepancies.json
            reused=true
          else
            npm run kg:bundle
            npm run kg:verify
          fi
          # The prepared file with the discrepancies, then the website package.
          npm run serving -- --require-discrepancies
          npm run validate:benchmark-literature
          npm run export:benchmark-literature
          npm run refresh -- export
          node scripts/package-website.mjs --current-only
          next=$(node scripts/release/next.mjs latest)
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Previous release $previous; candidate $next"
      - name: Stop if the candidate only renames the current release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
        run: |
          # The receipt published with the previous prepared file records its serving contract.
          gh release download "serving/$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "catalogue-$PREVIOUS.json" --dir "$RUNNER_TEMP/published" \
            || echo "::warning::No published serving receipt for $PREVIOUS; comparing release files only."
          set +e
          node scripts/release/next.mjs pending "$PREVIOUS" "${{ steps.candidate.outputs.next }}" "$RUNNER_TEMP/published/catalogue-$PREVIOUS.json"
          status=$?
          set -e
          if [ "$status" = 3 ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$status" = 0 ] && echo "release=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Refuse a release that withholds reviewed use-case mappings
        if: steps.pending.outputs.release == 'true'
        run: node scripts/release/next.mjs withheld "${{ steps.candidate.outputs.previous }}" "${{ steps.candidate.outputs.next }}"
      # Types, tests, the store, SHACL, Python and KG tests already passed in "Benchmark data
      # checks" for this commit. The build itself refuses to change an archived file.
      - name: Check the packaging and prepared file
        if: steps.pending.outputs.release == 'true'
        run: |
          # The packaging check reads the index: the receipt and manifest must be staged,
          # and the release files, which are ignored, must not be.
          git add -A data website
          npm run verify:package
          npm run serving:parity
      # The build ran beside the checks. Find the newest commit pushed to main that this build
      # contains (a release commit on top of it starts no checks) and wait for its checks.
      - name: Wait for the data checks on the commit this release was built from
        if: steps.pending.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow data.yml --branch main --event push --limit 20 --json headSha,status,conclusion --jq '.[] | "\(.headSha) \(.status) \(.conclusion)"')
            while read -r sha status conclusion; do
              [ -n "$sha" ] || continue
              git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
              if [ "$status" != completed ]; then echo "Checks on $sha: $status"; break; fi
              if [ "$conclusion" = success ]; then echo "Checks passed on $sha"; exit 0; fi
              echo "::error::Benchmark data checks ended $conclusion on $sha; nothing is published."
              exit 1
            done <<< "$runs"
            sleep 30
          done
          echo "::error::Benchmark data checks did not finish within 45 minutes."
          exit 1
      - name: Commit the release to main
        if: steps.pending.outputs.release == 'true'
        id: commit
        env:
          RELEASE: ${{ steps.candidate.outputs.next }}
        run: |
          git config user.name "rewire-release-bot"
          git config user.email "rewire-release-bot@users.noreply.github.com"
          # The release commit is made on the commit the release was built from, and the tags
          # name it. A pull request merged while this release was being cut moves main on; the
          # release commit is then merged into the new main, not rebased onto it, so it still
          # holds exactly the code the release was built with (#267). The next run releases
          # that pull request.
          # Assigned first: a failure inside `echo "$(...)"` would not fail the step.
          sha=$(node scripts/release/commit.mjs commit "$RELEASE")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # rewire-database copies shared code from the tagged commit. Published assets are never
      # replaced, so check the commit before anything is published.
      - name: Check the release commit sits on the commit the release was built from
        if: steps.pending.outputs.release == 'true'
        run: node scripts/release/commit.mjs verify "${{ steps.commit.outputs.sha }}"
      - name: Publish the prepared release file and the release files
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag the release commit, the one made on the commit the release was built from;
          # the website reads its revision from the tag.
          RELEASE_TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: npm run serving:publish
      - name: Publish the knowledge-graph bundle (never replaces an existing asset)
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ steps.commit.outputs.sha }}
          REUSED: ${{ steps.candidate.outputs.reused }}
        # A release whose discrepancies came from the database built no bundle; kg-release.yml
        # builds and publishes it that night.
        run: |
          if [ "$REUSED" = true ]; then echo "No bundle was built for this release."; else npm run kg:publish; fi
      # The release files are not in Git, so once the release commit is pushed they exist only on
      # this runner until they are published. If publishing fails, keep them for a manual publish
      # (docs/release.md, "If publishing fails"); the next release run cannot start until it is done.
      - name: Keep the unpublished release files
        if: failure() && steps.commit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-release
          path: |
            public/serving
            public/kg
            website/files
            data/omics/releases/*/*.gz
          retention-days: 14
      - name: Check both tags name the release commit
        if: steps.pending.outputs.release == 'true'
        env:
          RELEASE: ${{ steps.candidate.outputs.next }}
          # Empty when the discrepancies came from the database: the release has no bundle of its own yet.
          KG_TAG: ${{ steps.candidate.outputs.reused != 'true' && format('kg/{0}', steps.candidate.outputs.next) || '' }}
        run: node scripts/release/commit.mjs verify "${{ steps.commit.outputs.sha }}" "serving/$RELEASE" $KG_TAG
      - name: Ask the website to adopt it
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: node scripts/release/dispatch-website.mjs
